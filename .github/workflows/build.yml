name: Android CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repo with submodules
      uses: actions/checkout@v4
      with:
        submodules: recursive
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build debug APK
      run: ./gradlew assembleDebug

    - name: Build sample plugin AAR
      run: ./gradlew :sample-plugin:assembleRelease

    - name: Convert plugin to DEX
      run: |
        mkdir -p plugin-dex
        find sample-plugin/build/outputs/aar -name "*.aar" -exec unzip -o {} -d plugin-dex/aar-extract \;
        D8=$(find $ANDROID_HOME/build-tools -name d8 | sort -r | head -n 1)
        echo "Using d8: $D8"
        $D8 --output plugin-dex --lib $ANDROID_HOME/platforms/android-34/android.jar plugin-dex/aar-extract/classes.jar
        ls -la plugin-dex

    - name: Copy DEX to mods folder
      run: |
        mkdir -p mods
        cp plugin-dex/classes.dex mods/sample-plugin.dex
        ls -la mods/

    - name: Commit and push mods folder
      run: |
        git config user.name "github-actions"
        git config user.email "github-actions@github.com"
        git add mods/
        git diff --staged --quiet || git commit -m "Auto-build: update mods folder"
        git push

    - name: Upload APK
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: app-debug
        path: app/build/outputs/apk/**/*.apk
        if-no-files-found: error

    - name: Upload plugin DEX
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: sample-plugin-dex
        path: plugin-dex/classes.dex
        if-no-files-found: error
